<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2E33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#413F3D;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="shimmerH" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="2" height="2" fill="#F2F1EF" opacity="0.04"/>
    </pattern>
    
    <linearGradient id="luminousH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#D8CFD0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#697184;stop-opacity:0.8" />
    </linearGradient>
    
    <radialGradient id="glowH">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#697184;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#darkBgH)"/>
  <rect width="1200" height="400" fill="url(#shimmerH)"/>
  
  <g opacity="0.5">
    <ellipse cx="120" cy="200" rx="130" ry="120" fill="url(#glowH)"/>
  </g>
  
  <g opacity="0.25">
    <path d="M50 130 L110 120 L90 180 Z" fill="none" stroke="#D8CFD0" stroke-width="0.6"/>
    <path d="M70 250 L120 270 L60 290 Z" fill="none" stroke="#F2F1EF" stroke-width="0.6"/>
    <rect x="75" y="180" width="30" height="30" fill="none" stroke"#697184" stroke-width="0.5" transform="rotate(45 90 195)"/>
    <line x1="1020" y1="120" x2="1150" y2="120" stroke="#F2F1EF" stroke-width="0.8"/>
    <line x1="1020" y1="280" x2="1150" y2="280" stroke="#F2F1EF" stroke-width="0.8"/>
    <path d="M1060 160 L1110 150 L1090 200 Z" fill="#697184" opacity="0.3"/>
  </g>
  
  <g transform="translate(140, 200)">
    <!-- V icon with glow -->
    <g transform="translate(0, -45)">
      <g opacity="0.3">
        <g transform="scale(1.8)">
          <path d="M0 0 L20 0 L30 50 Z" fill="#697184" filter="blur(2px)"/>
          <path d="M40 0 L60 0 L30 50 Z" fill="#D8CFD0" filter="blur(2px)"/>
        </g>
      </g>
      <g transform="scale(1.8)">
        <path d="M0 0 L20 0 L30 50 Z" fill="#E8E7E5"/>
        <path d="M40 0 L60 0 L30 50 Z" fill="#F2F1EF"/>
      </g>
    </g>
    
    <text x="120" y="10" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="84" 
          font-weight="400"
          fill="#F2F1EF" 
          letter-spacing="-2.5">irtuServe</text>
    
    <line x1="0" y1="38" x2="280" y2="38" stroke="url(#luminousH)" stroke-width="2" opacity="0.7"/>
    
    <text x="2" y="65" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="15" 
          font-weight="300"
          fill="#B1A6A4" 
          letter-spacing="8">EXCELLENCE DELIVERED</text>
  </g>
  
  <g opacity="0.5">
    <path d="M1068 118 L1074 122 L1070 128 Z" fill="#F2F1EF"/>
    <path d="M1088 114 L1094 118 L1090 124 Z" fill="#D8CFD0"/>
    <path d="M1108 120 L1114 124 L1110 130 Z" fill="#697184"/>
    <line x1="1071" y1="122" x2="1091" y2="118" stroke="#D8CFD0" stroke-width="0.4" opacity="0.5"/>
    <line x1="1091" y1="118" x2="1111" y2="124" stroke="#D8CFD0" stroke-width="0.4" opacity="0.5"/>
  </g>
</svg>
