<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Elegant gradient background -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F2F1EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E6E3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle pattern overlay -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="1.5" height="1.5" fill="#697184" opacity="0.08"/>
    </pattern>
    
    <!-- Accent gradient for decorative elements -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D8CFD0;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1584" height="396" fill="url(#lightBg)"/>
  <rect width="1584" height="396" fill="url(#dots)"/>
  
  <!-- Creative angular geometric elements -->
  <g opacity="0.15">
    <!-- Left side angular shapes -->
    <path d="M80 100 L180 80 L160 180 Z" fill="none" stroke="#697184" stroke-width="1"/>
    <path d="M100 220 L140 280 L60 300 Z" fill="none" stroke="#413F3D" stroke-width="0.8"/>
    <line x1="50" y1="50" x2="200" y2="70" stroke="#697184" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="50" y1="346" x2="200" y2="326" stroke="#697184" stroke-width="1" stroke-dasharray="5,3"/>
    
    <!-- Right side modern accents -->
    <path d="M1464 100 L1520 120 L1500 70 Z" fill="#D8CFD0" opacity="0.3"/>
    <path d="M1464 296 L1520 276 L1500 326 Z" fill="#697184" opacity="0.25"/>
    <line x1="1380" y1="50" x2="1550" y2="50" stroke="url(#accentGrad)" stroke-width="2"/>
    <line x1="1380" y1="346" x2="1550" y2="346" stroke="url(#accentGrad)" stroke-width="2"/>
    <rect x="1450" y="180" width="40" height="40" fill="none" stroke="#697184" stroke-width="0.8" transform="rotate(45 1470 200)"/>
  </g>
  
  <!-- Main content - centered for better composition -->
  <g transform="translate(470, 198)">
    <!-- V icon integrated as first letter -->
    <g transform="translate(0, -52)">
      <g transform="scale(2.1)">
        <path d="M0 0 L20 0 L30 50 Z" fill="#697184"/>
        <path d="M40 0 L60 0 L30 50 Z" fill="#413F3D"/>
      </g>
    </g>
    
    <!-- "irtuServe" wordmark -->
    <text x="140" y="12" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="96" 
          font-weight="400"
          fill="#413F3D" 
          letter-spacing="-3">irtuServe</text>
    
    <!-- Elegant divider line -->
    <line x1="0" y1="42" x2="320" y2="42" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Tagline with refined spacing -->
    <text x="2" y="75" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="300"
          fill="#697184" 
          letter-spacing="10">EXCELLENCE DELIVERED</text>
  </g>
  
  <!-- Sophisticated corner accent triangles -->
  <g opacity="0.4">
    <path d="M1460 58 L1466 62 L1462 68 Z" fill="#D8CFD0"/>
    <path d="M1482 56 L1488 60 L1484 66 Z" fill="#697184"/>
    <path d="M1504 58 L1510 62 L1506 68 Z" fill="#D8CFD0"/>
    
    <path d="M1460 338 L1466 334 L1462 328 Z" fill="#D8CFD0"/>
    <path d="M1482 340 L1488 336 L1484 330 Z" fill="#697184"/>
    <path d="M1504 338 L1510 334 L1506 328 Z" fill="#D8CFD0"/>
  </g>
</svg>
