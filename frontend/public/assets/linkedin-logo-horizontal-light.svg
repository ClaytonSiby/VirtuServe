<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F2F1EF;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="dotsH" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="1.5" height="1.5" fill="#697184" opacity="0.06"/>
    </pattern>
    
    <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D8CFD0;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#lightBgH)"/>
  <rect width="1200" height="400" fill="url(#dotsH)"/>
  
  <!-- Angular decorative elements -->
  <g opacity="0.15">
    <path d="M60 120 L120 110 L100 170 Z" fill="none" stroke="#697184" stroke-width="0.8"/>
    <path d="M80 240 L130 260 L70 280 Z" fill="none" stroke="#413F3D" stroke-width="0.6"/>
    <rect x="80" y="180" width="35" height="35" fill="none" stroke="#697184" stroke-width="0.8" transform="rotate(45 97.5 197.5)"/>
    <line x1="1050" y1="100" x2="1150" y2="100" stroke="url(#accentH)" stroke-width="1.5"/>
    <line x1="1050" y1="300" x2="1150" y2="300" stroke="url(#accentH)" stroke-width="1.5"/>
    <path d="M1080 150 L1130 140 L1110 190 Z" fill="#D8CFD0" opacity="0.4"/>
  </g>
  
  <g transform="translate(140, 200)">
    <!-- V icon -->
