    </g>
    
    <text x="120" y="10" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="84" 
          font-weight="400"
          fill="#413F3D" 
          letter-spacing="-2.5">irtuServe</text>
    
    <line x1="0" y1="38" x2="280" y2="38" stroke="url(#accentH)" stroke-width="1.5" opacity="0.6"/>
    
    <text x="2" y="65" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="15" 
          font-weight="300"
          fill="#697184" 
          letter-spacing="8">EXCELLENCE DELIVERED</text>
  </g>
  
  <g opacity="0.4">
    <path d="M1078 98 L1084 102 L1080 108 Z" fill="#D8CFD0"/>
    <path d="M1098 96 L1104 100 L1100 106 Z" fill="#697184"/>
    <path d="M1118 98 L1124 102 L1120 108 Z" fill="#D8CFD0"/>
