<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich dark gradient background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2826;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2C2A28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E2C2A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Luminous accent gradient -->
    <linearGradient id="luminous" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#D8CFD0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#697184;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1584" height="396" fill="url(#darkBg)"/>
  
  <!-- Main content - centered for elegance -->
  <g transform="translate(470, 198)">
    <!-- V icon integrated as first letter -->
    <g transform="translate(0, -52)">
      <g transform="scale(2.1)">
        <path d="M0 0 L20 0 L30 50 Z" fill="#697184"/>
        <path d="M40 0 L60 0 L30 50 Z" fill="#F2F1EF"/>
      </g>
    </g>
    
    <!-- "irtuServe" wordmark -->
    <text x="140" y="12" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="96" 
          font-weight="400"
          fill="#F2F1EF" 
          letter-spacing="-3">irtuServe</text>
    
    <!-- Luminous divider line -->
    <line x1="0" y1="42" x2="320" y2="42" stroke="url(#luminous)" stroke-width="2" opacity="0.7"/>
    
    <!-- Tagline with refined spacing -->
    <text x="2" y="75" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="300"
          fill="#B1A6A4" 
          letter-spacing="10">EXCELLENCE DELIVERED</text>
  </g>
</svg>
