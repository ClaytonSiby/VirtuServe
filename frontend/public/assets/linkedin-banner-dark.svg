<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich dark gradient background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2E33;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3A3D42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#413F3D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shimmer pattern -->
    <pattern id="shimmer" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="2" height="2" fill="#F2F1EF" opacity="0.05"/>
    </pattern>
    
    <!-- Luminous accent gradient -->
    <linearGradient id="luminous" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#D8CFD0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#697184;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#697184;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#697184;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background layers -->
  <rect width="1584" height="396" fill="url(#darkBg)"/>
  <rect width="1584" height="396" fill="url(#shimmer)"/>
  
  <!-- Ambient glow elements -->
  <g opacity="0.6">
    <ellipse cx="150" cy="198" rx="200" ry="180" fill="url(#glow)"/>
    <ellipse cx="1450" cy="198" rx="180" ry="160" fill="url(#glow)"/>
  </g>
  
  <!-- Creative angular geometric elements -->
  <g opacity="0.25">
    <!-- Left side angular composition -->
    <path d="M70 90 L140 100 L120 160 Z" fill="none" stroke="#F2F1EF" stroke-width="0.8"/>
    <path d="M90 240 L160 260 L100 310 Z" fill="none" stroke="#D8CFD0" stroke-width="0.8"/>
    <line x1="80" y1="80" x2="200" y2="80" stroke="#F2F1EF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="316" x2="200" y2="316" stroke="#F2F1EF" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="100" y="178" width="30" height="30" fill="none" stroke="#D8CFD0" stroke-width="0.6" transform="rotate(45 115 193)"/>
    
    <!-- Right side elegant accents -->
    <path d="M1450 110 L1510 90 L1490 150 Z" fill="#697184" opacity="0.3"/>
    <path d="M1450 286 L1510 306 L1490 246 Z" fill="#D8CFD0" opacity="0.25"/>
    <path d="M1400 198 Q1460 198 1500 140" stroke="url(#luminous)" stroke-width="1.5" fill="none"/>
    <path d="M1400 198 Q1460 198 1500 256" stroke="url(#luminous)" stroke-width="1.5" fill="none"/>
    <line x1="1420" y1="60" x2="1540" y2="80" stroke="#697184" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="1420" y1="336" x2="1540" y2="316" stroke="#697184" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Main content - centered for elegance -->
  <g transform="translate(470, 198)">
    <!-- V icon with subtle glow -->
    <g transform="translate(0, -52)">
      <!-- Glow effect behind V -->
      <g opacity="0.4">
        <g transform="scale(2.1)">
          <path d="M0 0 L20 0 L30 50 Z" fill="#697184" filter="blur(3px)"/>
          <path d="M40 0 L60 0 L30 50 Z" fill="#D8CFD0" filter="blur(3px)"/>
        </g>
      </g>
      <!-- Sharp V on top -->
      <g transform="scale(2.1)">
        <path d="M0 0 L20 0 L30 50 Z" fill="#E8E7E5"/>
        <path d="M40 0 L60 0 L30 50 Z" fill="#F2F1EF"/>
      </g>
    </g>
    
    <!-- "irtuServe" wordmark -->
    <text x="140" y="12" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="96" 
          font-weight="400"
          fill="#F2F1EF" 
          letter-spacing="-3">irtuServe</text>
    
    <!-- Luminous divider line -->
    <line x1="0" y1="42" x2="320" y2="42" stroke="url(#luminous)" stroke-width="2" opacity="0.7"/>
    
    <!-- Tagline with refined spacing -->
    <text x="2" y="75" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="300"
          fill="#B1A6A4" 
          letter-spacing="10">EXCELLENCE DELIVERED</text>
  </g>
  
  <!-- Refined angular corner accents -->
  <g opacity="0.5">
    <!-- Top right angular constellation -->
    <path d="M1462 58 L1468 62 L1464 68 Z" fill="#F2F1EF"/>
    <path d="M1484 54 L1490 58 L1486 64 Z" fill="#D8CFD0"/>
    <path d="M1506 60 L1512 64 L1508 70 Z" fill="#697184"/>
    <line x1="1466" y1="62" x2="1487" y2="58" stroke="#D8CFD0" stroke-width="0.5" opacity="0.6"/>
    <line x1="1487" y1="58" x2="1509" y2="64" stroke="#D8CFD0" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Bottom right angular constellation -->
    <path d="M1462 338 L1468 334 L1464 328 Z" fill="#F2F1EF"/>
    <path d="M1484 342 L1490 338 L1486 332 Z" fill="#D8CFD0"/>
    <path d="M1506 336 L1512 332 L1508 326 Z" fill="#697184"/>
    <line x1="1466" y1="334" x2="1487" y2="338" stroke="#D8CFD0" stroke-width="0.5" opacity="0.6"/>
    <line x1="1487" y1="338" x2="1509" y2="332" stroke="#D8CFD0" stroke-width="0.5" opacity="0.6"/>
  </g>
</svg>
